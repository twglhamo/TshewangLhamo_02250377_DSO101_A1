services:
  # PostgreSQL Database
  - type: pserv
    name: todo-postgres
    ipAllowList: []
    plan: free
    region: singapore
    postgresVersion: 15
    initialDbName: tododb_yao3
    user: todouser
    passwordEnvVarName: DATABASE_PASSWORD

  # Backend Service
  - type: web
    name: be-todo
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DB_HOST
        value: todo-postgres.render.internal
      - key: DB_USER
        value: todouser
      - key: DB_PASSWORD
        value: ${DATABASE_PASSWORD}
      - key: DB_NAME
        value: tododb_yao3
      - key: DB_PORT
        value: "5432"
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    depends_on:
      - todo-postgres

  # Frontend Service
  - type: web
    name: fe-todo
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: REACT_APP_API_URL
        value: https://be-todo.onrender.com